framework:
    secret: test
    handle_all_throwables: true
    http_method_override: false
    test: true
    router:
        utf8: true
        resource: '%kernel.project_dir%/config/routing.yaml'
    annotations: false

    php_errors:
        log: true

    property_info:
        with_constructor_extractor: false

    uid:
        default_uuid_version: 7
        time_based_uuid_version: 7

    validation:
        email_validation_mode: html5

twig:
    strict_variables: true
    default_path: '%kernel.project_dir%/templates'

webmunkeez_i18n:
    enabled_locales: [en, fr, es]
    sites:
        - host: example.com
          path: /fr
          locale: fr
        - host: example.com
          path: /api
        - host: example.com
          locale: en
        - host: es.example.com
          locale: es

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in TestBundle/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    Webmunkeez\I18nBundle\Test\Fixture\TestBundle\:
        resource: '../TestBundle/'

    Webmunkeez\I18nBundle\Test\Fixture\TestBundle\Controller\:
        resource: '../TestBundle/Controller/'
        public: true

    test_validator:
        alias: validator
        public: true

    Webmunkeez\I18nBundle\Test\Fixture\TestBundle\EventListener\PreLanguageRequestListener:
        tags:
            - { name: kernel.event_listener, event: kernel.request, priority: 50 }
